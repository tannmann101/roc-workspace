name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ${{ runner.temp }}/gcp-key.json
      - name: Sync the Anthropic secret
        # `firebase deploy` won't pick up a secret that was created directly
        # in Secret Manager -- it wants to manage the binding itself via this
        # command, which also handles creating it on the very first run.
        run: |
          echo -n "$ANTHROPIC_API_KEY" | npx firebase-tools functions:secrets:set ANTHROPIC_API_KEY \
            --project roc-workspace --data-file=- --force --non-interactive
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
      - name: Deploy functions
        # --force also auto-confirms setting up an Artifact Registry cleanup
        # policy for old container images, which the CLI otherwise treats as
        # a fatal error rather than a skippable prompt in non-interactive mode.
        run: npx firebase-tools deploy --only functions --project roc-workspace --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
